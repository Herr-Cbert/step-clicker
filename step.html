<html>
	<head>
		<title>Test</title>
	</head>
	
	<body>
	    <canvas id="myCanvas" width="800" height="600"></canvas>
		<script type="text/javascript">
	
//		document.onkeypress = Tastendruck;	// die Funktion Tastendruck wird angemeldet
		document.onclick = Mausklick;		// die Funktion Mausklick wird angemeldet
    	
		var canvas = document.getElementById('myCanvas');
    	var context = canvas.getContext('2d');
		var x=100;
		var y=100;

//		alert( " Hallo " );

		function toInteger(number)
		{ 
			return Math.round( Number(number) ); 
		}

		function toPoint(number)
		{
        	var laenge=0;		// laenge der Nachkommastellen
            var sep=" ";		// Normalerweise Komma
            var th_sep=".";		// Tausenderseparator

 			number = Math.round( number * Math.pow(10, laenge) ) / Math.pow(10, laenge);
  			str_number = number+"";
			arr_int = str_number.split(".");
			
			if(!arr_int[0]) 
				arr_int[0] = "0";
			
			if(!arr_int[1]) 
				arr_int[1] = "";
			
			if(arr_int[1].length < laenge)
			{
    			nachkomma = arr_int[1];
    			for(i=arr_int[1].length+1; i <= laenge; i++)
					nachkomma += "0";  
    			
				arr_int[1] = nachkomma;
  			}
  			if(th_sep != "" && arr_int[0].length > 3)
			{
    			Begriff = arr_int[0];
    			arr_int[0] = "";
    			
				for(j = 3; j < Begriff.length ; j+=3)
				{
      				Extrakt = Begriff.slice(Begriff.length - j, Begriff.length - j + 3);
      				arr_int[0] = th_sep + Extrakt +  arr_int[0] + "";
    			}
    			
				str_first = Begriff.substr(0, (Begriff.length % 3 == 0)?3:(Begriff.length % 3));
    			arr_int[0] = str_first + arr_int[0];
  			}
  			return arr_int[0]+sep+arr_int[1];
		}
		
		function toPoint1(number, laenge)	// laenge ist laenge der Nachkommastellen
		{
            var sep=",";		// Normalerweise Komma
            var th_sep=".";		// Tausenderseparator

 			number = Math.round( number * Math.pow(10, laenge) ) / Math.pow(10, laenge);
  			str_number = number+"";
			arr_int = str_number.split(".");
			
			if(!arr_int[0]) 
				arr_int[0] = "0";
			
			if(!arr_int[1]) 
				arr_int[1] = "";
			
			if(arr_int[1].length < laenge)
			{
    			nachkomma = arr_int[1];
    			for(i=arr_int[1].length+1; i <= laenge; i++)
					nachkomma += "0";  
    			
				arr_int[1] = nachkomma;
  			}
  			if(th_sep != "" && arr_int[0].length > 3)
			{
    			Begriff = arr_int[0];
    			arr_int[0] = "";
    			
				for(j = 3; j < Begriff.length ; j+=3)
				{
      				Extrakt = Begriff.slice(Begriff.length - j, Begriff.length - j + 3);
      				arr_int[0] = th_sep + Extrakt +  arr_int[0] + "";
    			}
    			
				str_first = Begriff.substr(0, (Begriff.length % 3 == 0)?3:(Begriff.length % 3));
    			arr_int[0] = str_first + arr_int[0];
  			}
  			return arr_int[0]+sep+arr_int[1];
		}

		function rgbToString(r, g, b)
		{
			if (r<16)	ergr="0"+(r).toString(16);
			else		ergr=(r).toString(16);
			if (g<16)	ergg="0"+(g).toString(16);
			else		ergg=(g).toString(16);
			if (b<16)	ergb="0"+(b).toString(16);
			else		ergb=(b).toString(16);
			return ergr+ergg+ergb;
		}


		function bar(x, y, breite, hoehe, r, g, b)
		{
			context.fillStyle="#"+rgbToString(r,g,b);
			context.fillRect(x,y,breite,hoehe);
		}
			
		function line(x1, y1, x2, y2, r, g, b)
		{
			context.strokeStyle="#"+(r).toString(16)+(g).toString(16)+(b).toString(16);
			context.beginPath();
			context.moveTo(x1,y1);
			context.lineTo(x2,y2);
			context.stroke();
		}
		
		function circle(x, y, radius, r, g, b)
		{
			context.strokeStyle="#"+(r).toString(16)+(g).toString(16)+(b).toString(16);
			context.beginPath();
			for(i=1;i<=radius;i++)
				context.arc(x,y,i,0,2*Math.PI);
			context.stroke();
		}
			
		function graTextOut(x, y, size, text, r, g, b) 
		{
			context.fillStyle="#"+rgbToString(r,g,b);
			context.font=(size).toString(10)+"px Times New Roman";
			context.fillText(text, x, y);
		}



		//###################################
		// Das Vorgehen:
		// Bei einem Klick auf GO wird die 'arbeitsDauer' runter gezaehlt
		// ist die 'arbeitsDauer' auf null wird der 'verdienst' * 'objekteZahl'  zum 'guthaben' addiert
		//
		// Bei einem Klick auf KAUFEN wird bei genuegend 'guthaben' die 'objekteZahl' um eins erhoeht
		// Der 'aktuellerPreis' wird mit der 'preisSteigerung' multipliziert
		//
		// die 'arbeitsDauer' wird bei einer 'objekteZahl' von 10 25 50 100 250 500 jeweils halbiert



		//###################################
		// die Variablen

		var aktuellerPreis=1.0;
		var preisSteigerung=1.2;

		var automatik=0;
		var automatikPreis=100;
		var automatikObjekteShow=10
		
		var objekteZahl=1;
		var objektMultiplikator=1.0;
		var verdienst=1;
		var guthaben=0;

		var arbeitsDauer=32;	// in 0.1 Sekunden Schritten
		var arbeitsDauerDelta=1;
		var aktuelleArbeitsDauer=0;






		function Mausklick (evt) 
		{
			x=evt.offsetX;
			y=evt.offsetY;
	
			if ((x>10)&&(x<70)&&(y>50)&&(y<80))	// GO Button
			{
				if (aktuelleArbeitsDauer==0)
				 	aktuelleArbeitsDauer=arbeitsDauer;
			}
			
			if ((x>10)&&(x<160)&&(y>130)&&(y<160))	// BUY Button
			{
				if (guthaben>=aktuellerPreis)
				{
					guthaben-=aktuellerPreis;
					objekteZahl++;
					aktuellerPreis*=preisSteigerung;
					if ((objekteZahl==10) || (objekteZahl==25) || (objekteZahl==50))	
						arbeitsDauerDelta*=2;
				}
			}
			
			if ((x>10)&&(x<160)&&(y>170)&&(y<200))	// automatik Button
			{
				if (automatik==0)
				{
					if (guthaben>=automatikPreis)
					{
						automatik=1;
						guthaben-=automatikPreis;
						if (aktuelleArbeitsDauer==0)
				 			aktuelleArbeitsDauer=arbeitsDauer;
					}
				}
			}
		}



//######################################################################################################## go1
//######################################################################################################## go1
//######################################################################################################## go1
//######################################################################################################## go1
		function go1()	// 0.1 Sekunde
		{
			if (aktuelleArbeitsDauer>0)
			{
				aktuelleArbeitsDauer-=arbeitsDauerDelta;
				if (aktuelleArbeitsDauer<=0)
				{
					aktuelleArbeitsDauer=0;
					guthaben+=verdienst*objekteZahl;
					if (automatik==1)
						aktuelleArbeitsDauer=arbeitsDauer;
				}
			}
		}



//######################################################################################################## go
//######################################################################################################## go
//######################################################################################################## go
//######################################################################################################## go
		function go()
		{
			
			bar(0,0,620,600,255,255,255);
		
			
//			bar(10,100,100,30,55,55,55);

			graTextOut(560,8,12,"V 0.80124",0,0,0);

			var text= toPoint(guthaben) + " $";
			graTextOut(10,40,30,text,0,0,0);
			

			bar(10,50,60,30,155,155,155);
			graTextOut(30,70,16,"GO",0,0,0);
			var text=toPoint(objekteZahl) + " x " +toPoint1(objektMultiplikator,2);
			graTextOut(80,70,16,text,0,0,0);

			graTextOut(80,70,16,text,0,0,0);



			bar(10,85,152,30,100,100,100);
			if (aktuelleArbeitsDauer>0)
			{
				bar(12,87,(arbeitsDauer-aktuelleArbeitsDauer)*150/arbeitsDauer,26,0,200,200)
				var text=toPoint(100-aktuelleArbeitsDauer*100/128);
				graTextOut(20,105,16,text,0,0,0);
			}

			if (objekteZahl>=10)	bar(164,85, 6,4,0,0,200);
			if (objekteZahl>=25)	bar(164,90, 6,4,0,0,200);
			if (objekteZahl>=50)	bar(164,95, 6,4,0,0,200);
			if (objekteZahl>=100)	bar(164,100,6,4,0,0,200);



			if (guthaben>=aktuellerPreis)
				bar(10,130,150,30,0,155,0);
			else
				bar(10,130,150,30,155,155,155);
			var text="Buy (" + toPoint1(aktuellerPreis,2) + " $)";
			graTextOut(15,150,16,text,0,0,0);

			// Der Automatikbutton
			if ((objekteZahl>=automatikObjekteShow)&&(automatik==0))
			{
				if (guthaben>=automatikPreis)
					bar(10,170,150,30,0,155,0);
				else
					bar(10,170,150,30,155,155,155);
				var text="AUTO " + toPoint(automatikPreis) + " $";
				graTextOut(20,190,16,text,0,0,0);
			}
		}

		function start()
		{
			context.fillStyle="#ffffff";
			context.fillRect(0, 0, canvas.width, canvas.height);
			
			bar(0,0,600,600,255,255,255);

			setInterval(go, 10);	// bewirkt das die Funktion go  dann und wann aufgerufen wird je gruesser die Zahl desto langsamer (10 -> 0.01 Sekunde)
			setInterval(go1, 100);	// bewirkt das die Funktion go1 dann und wann aufgerufen wird je gruesser die Zahl desto langsamer (100 -> 0.1 Sekunde)
		}
		
		start();	// hier wird das ganze gestartet 
		
		</script>
	</body>
</html>
