		function toPoint(number)
		{
        	var laenge=0;		// laenge der Nachkommastellen
            var sep=" ";		// Normalerweise Komma
            var th_sep=".";		// Tausenderseparator

 			number = Math.round( number * Math.pow(10, laenge) ) / Math.pow(10, laenge);
  			str_number = number+"";
			arr_int = str_number.split(".");
			
			if(!arr_int[0]) 
				arr_int[0] = "0";
			
			if(!arr_int[1]) 
				arr_int[1] = "";
			
			if(arr_int[1].length < laenge)
			{
    			nachkomma = arr_int[1];
    			for(i=arr_int[1].length+1; i <= laenge; i++)
					nachkomma += "0";  
    			
				arr_int[1] = nachkomma;
  			}
  			if(th_sep != "" && arr_int[0].length > 3)
			{
    			Begriff = arr_int[0];
    			arr_int[0] = "";
    			
				for(j = 3; j < Begriff.length ; j+=3)
				{
      				Extrakt = Begriff.slice(Begriff.length - j, Begriff.length - j + 3);
      				arr_int[0] = th_sep + Extrakt +  arr_int[0] + "";
    			}
    			
				str_first = Begriff.substr(0, (Begriff.length % 3 == 0)?3:(Begriff.length % 3));
    			arr_int[0] = str_first + arr_int[0];
  			}
  			return arr_int[0]+sep+arr_int[1];
		}

		function toPoint2(number)
		{
			var laenge=0;
			var erg="----";

			laenge=number.length;

			if (laenge>8)
			{
				if (laenge%4==1)
					erg=number[0]+","+number[2]+number[3]+number[4];
				if (laenge%4==2)
					erg=number[0]+number[1]+","+number[3]+number[4]+number[5];
				if (laenge%4==3)
					erg=number[0]+number[1]+number[2]+","+number[4]+number[5]+number[6];
				
				if (toInteger((laenge-10)/4)==0) erg+="K";	// Thousand
				if (toInteger((laenge-10)/4)==1) erg+="M";	// Million
				if (toInteger((laenge-10)/4)==2) erg+="B";	// Billion
				if (toInteger((laenge-10)/4)==3) erg+="T"; 	// Trillion
				if (toInteger((laenge-9)/4)==4) erg+="q";	// Quadrillion
				if (toInteger((laenge-9)/4)==5) erg+="Q";	// Quintillion
				if (toInteger((laenge-9)/4)==6) erg+="s";	// Sextillion
				if (toInteger((laenge-9)/4)==7) erg+="S";	// Septillion
				if (toInteger((laenge-9)/4)==8) erg+="Oc";	// Octillion
				if (toInteger((laenge-9)/4)==9) erg+="N";	// Nonillion
				if (toInteger((laenge-9)/4)==10) erg+="D";	// Decillion
			}
			else
				return number;

			return erg;
		}
	
		function rgbToString(r, g, b)
		{
			if (r<16)	ergr="0"+(r).toString(16);
			else		ergr=(r).toString(16);
			if (g<16)	ergg="0"+(g).toString(16);
			else		ergg=(g).toString(16);
			if (b<16)	ergb="0"+(b).toString(16);
			else		ergb=(b).toString(16);
			return ergr+ergg+ergb;
		}

		function line(x1, y1, x2, y2, r, g, b)
		{
//			context.strokeStyle="#"+(r).toString(16)+(g).toString(16)+(b).toString(16);
			context.strokeStyle="#"+rgbToString(r,g,b);
			context.beginPath();
			context.moveTo(x1,y1);
			context.lineTo(x2,y2);
			context.stroke();
		}

		function bar(x, y, breite, hoehe, r, g, b)
		{
			context.fillStyle="#"+rgbToString(r,g,b);
			context.fillRect(x,y,breite,hoehe);
		}
		
		function bar1(x, y, breite, hoehe, hochtief, r, g, b)
		{
			context.fillStyle="#"+rgbToString(r,g,b);
			context.fillRect(x,y,breite,hoehe);

			var color1=255;
			var color2=0;
			if (hochtief==1)
			{
				color2=255;
				color1=0;
			}
 	
			line(x,y,x+breite,y,color1,color1,color1);	// Oben
			line(x,y,x,y+hoehe,color1,color1,color1);	// Links
			line(x,y+hoehe,x+breite,y+hoehe,color2,color2,color2);	// Unten
			line(x+breite,y,x+breite,y+hoehe,color2,color2,color2);	// Rechts
		}
			
		
		function circle(x, y, radius, r, g, b)
		{
			context.strokeStyle="#"+(r).toString(16)+(g).toString(16)+(b).toString(16);
			context.beginPath();
			for(i=1;i<=radius;i++)
				context.arc(x,y,i,0,2*Math.PI);
			context.stroke();
		}
			
		function graTextOut(x, y, size, text, r, g, b) 
		{
			context.fillStyle="#"+rgbToString(r,g,b);
	//		context.font=(size).toString(10)+"px Times New Roman";
			context.font=(size).toString(10)+"px Calibri";
			context.fillText(text, x, y);
		}

				if (b_buchstabe[i]==9) b="J";if (b_buchstabe[i]==10) b="K";if (b_buchstabe[i]==11) b="L";

				if ((guthaben>=b_preis[i])&&(b_gekauft[i]==0)&&(objektAktiv[i]==1))
					graTextOut(545,103+i*58,40,b,0,100,0);

				var text="$" + toPoint2(toPoint1(b_preis[i],3));
				graTextOut(600,103+i*58,14,text,0,0,0);


				if (b_gekauft[i]!=0)
				{
					for(var j=0;j<6;j++)
					{
						line(680+j,88+i*58,695+j,100+i*58,0,100,0);
						line(695+j,100+i*58,715+j,70+i*58,0,100,0);
					}
				}
				
				
				bonizaehler++;
				if (bonizaehler>10)
					break;
			}
						
			if (objekteZahl[11]>39)
			{
				welt*=1.1;

				
				guthaben=0;

				for(var i=0;i<15;i++)
				{
					objektAktiv[i]=0;
					automatik[i]=0;
					automatikObjekteShow[i]=10
					objekteZahl[i]=1;
					aktuelleArbeitsDauer[i]=0;
				}
		
				objektAktiv[0]=1;

				aktuellerPreis[0]=4.0;			//A

				automatikPreis[0]=100;

				automatikPreis[1]=4000;
				verdienst[1]=30;
				arbeitsDauer[1]=50;	// eigendlich 64

				automatikPreis[2]=22000;

		function start()
		{

			setInterval(go1, 100);	// bewirkt das die Funktion go1 dann und wann aufgerufen wird je gruesser die Zahl desto langsamer (100 -> 0.1 Sekunde)
